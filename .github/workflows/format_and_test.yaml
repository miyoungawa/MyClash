name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  pull_request:
    paths:
      - 'Script/*'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

# 主分支推送时与 update-script 共用同一分组（myclash-refs/heads/main），
# 串行执行可避免两者并发 push 被判非快进而失败；PR 用各自分组并取消旧运行
concurrency:
  group: myclash-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install tools
        run: npm install -g prettier

      - name: format files
        run: |
          git ls-files -z '*.js' '*.yml' '*.yaml' | xargs -0 -r prettier --write

      - name: commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: auto format"

            # 若远端在此期间有新提交，先变基再推送
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

  test:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install dependencies
        run: npm --prefix Test install

      - name: run tests
        run: node Test/run-tests.js
