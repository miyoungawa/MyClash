name: Build Script.js with Discord

on:
  workflow_dispatch:

  schedule:
    # 每 6 小时检查一次，使用 UTC 时间
    - cron: '17 */6 * * *'

  push:
    branches:
      - main
    paths:
      - 'overlay/**'
      - 'tools/build.mjs'
      - '.github/workflows/update-script.yml'

permissions:
  contents: write

# 与 format_and_test 共用同一分组（myclash-refs/heads/main）：
# 两者都会自动提交并推送，串行执行可避免并发 push 被判非快进而失败
concurrency:
  group: myclash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download, merge and verify
        run: node tools/build.mjs

      - name: Commit generated Script.js
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- dist/Script.js)" ]; then
            echo "Upstream Script.js has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/Script.js
          git commit -m "chore: update generated Script.js"

          # 若远端在此期间有新提交，先变基再推送
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
